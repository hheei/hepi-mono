[package]
name = "pi-ext-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
flume = { workspace = true }
mpatch = { path = "../vendor/mpatch" }
napi = { workspace = true }
napi-derive = "3"
pi-shell = { path = "../vendor/oh-my-pi/pi-shell" }
tokio = { workspace = true, features = ["process", "fs"] }
tokio-util = { workspace = true }

[build-dependencies]
napi-build = "2"
