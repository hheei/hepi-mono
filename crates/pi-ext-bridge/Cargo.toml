[package]
name = "pi-ext-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { workspace = true }
napi-derive = "3"
tempfile = "3"
tokio = { workspace = true, features = ["process", "fs"] }

[build-dependencies]
napi-build = "2"
